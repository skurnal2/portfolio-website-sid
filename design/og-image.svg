<!-- Source for public/og-image.png (link previews). Regenerate with:
     magick -background none design/og-image.svg -resize 1200x630! -strip -quality 92 public/og-image.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="110%">
      <stop offset="0%"   stop-color="#0d5265"/>
      <stop offset="55%"  stop-color="#073B4C"/>
      <stop offset="100%" stop-color="#042833"/>
    </radialGradient>
    <linearGradient id="blobA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF7F50" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF7F50" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blobB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#B0E0E6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#40A4AF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- floating glass blobs, echoing the hero circles -->
  <rect x="838" y="70"  width="300" height="300" rx="90" fill="url(#blobA)" filter="url(#soft)" opacity="0.85"/>
  <rect x="930" y="300" width="240" height="240" rx="72" fill="url(#blobB)" filter="url(#soft)" opacity="0.75"/>
  <rect x="838" y="70"  width="300" height="300" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="930" y="300" width="240" height="240" rx="72" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- coral rule -->
  <rect x="88" y="196" width="86" height="7" rx="3.5" fill="#FF7F50"/>

  <text x="88" y="316" font-family="Inter Display, Inter, sans-serif" font-weight="900"
        font-size="104" letter-spacing="-4" fill="#ffffff">SIDDHARTH</text>
  <text x="88" y="424" font-family="Inter Display, Inter, sans-serif" font-weight="900"
        font-size="104" letter-spacing="-4" fill="#ffffff" fill-opacity="0.42">KURNAL</text>

  <text x="88" y="176" font-family="Inter, sans-serif" font-weight="600"
        font-size="30" letter-spacing="7" fill="#B0E0E6">FULL-STACK DEVELOPER</text>

  <text x="88" y="524" font-family="Inter, sans-serif" font-weight="400"
        font-size="27" letter-spacing="1" fill="#ffffff" fill-opacity="0.62">.NET · Angular · React · Azure &amp; AWS · AI &amp; RAG</text>

  <text x="88" y="576" font-family="Inter, sans-serif" font-weight="500"
        font-size="25" letter-spacing="1" fill="#FF7F50">siddharthkurnal.com</text>
</svg>
